<style>
:root{--bg:#1a1a1a;--bg2:#212121;--card:#2a2a2a;--border:#3a3a3a;--accent:#ffc107;--red:#f44336;--green:#4caf50;--cyan:#26c6da;--text:#e0e0e0;--muted:#9e9e9e;--dim:#666;--blue:#42a5f5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;overflow:hidden}
.topnav{display:flex;align-items:center;gap:16px;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:15px;color:var(--accent);cursor:pointer;white-space:nowrap}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:6px 14px;border-radius:4px;cursor:pointer;color:var(--muted);font-size:13px;transition:all .15s}
.nav-tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-tab.active{color:var(--accent);background:rgba(255,193,7,.1)}
.search-input{flex:1;max-width:280px;padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;outline:none}
.search-input:focus{border-color:var(--accent)}
.stats-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.stat-item{flex:1;padding:8px 16px;border-right:1px solid var(--border)}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase}
.stat-value{font-size:16px;font-weight:700}
.stat-sub{font-size:11px;color:var(--muted)}
.main{display:flex;height:calc(100vh - 86px)}
.sidebar{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
.sidebar-header{padding:10px 12px;border-bottom:1px solid var(--border)}
.cat-filters{display:flex;gap:3px;flex-wrap:wrap}
.cat-btn{padding:3px 8px;border-radius:3px;cursor:pointer;font-size:10px;color:var(--muted);background:transparent;border:1px solid var(--border)}
.cat-btn:hover{border-color:var(--accent);color:var(--text)}
.cat-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.chain-list{flex:1;overflow-y:auto;padding:4px 0}
.chain-item{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:2px solid transparent}
.chain-item:hover{background:rgba(255,255,255,.03)}
.chain-item.active{background:rgba(255,193,7,.08);border-left-color:var(--accent)}
.chain-item-name{font-size:12px}
.chain-item-count{font-size:10px;color:var(--dim);background:var(--card);padding:2px 6px;border-radius:3px}
.pool-section{border-top:1px solid var(--border);max-height:30vh;overflow-y:auto}
.pool-header{padding:8px 12px;font-size:10px;color:var(--dim);text-transform:uppercase}
.pool-item{padding:6px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.03)}
.pool-item:hover{background:rgba(255,255,255,.04)}
.pool-name{font-size:11px;font-weight:600}
.pool-code{font-size:9px;color:var(--dim)}
.pool-profit{font-size:11px;font-weight:600}
.pool-change{font-size:9px;font-weight:600}
.stat-change.up,.pool-change.up{color:var(--red)}
.stat-change.down,.pool-change.down{color:var(--green)}
.detail{flex:1;overflow-y:auto}
.detail-inner{padding:20px 24px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5}
.chain-flow{display:flex;gap:0;align-items:flex-start}
.chain-col{min-width:180px;max-width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:0 8px}
.chain-col-header{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:4px 8px;text-align:center;border-bottom:1px solid var(--border)}
.chain-arrow-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;padding-top:28px}
.chain-arrow-line{width:2px;height:20px;background:var(--border)}
.chain-arrow-head{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--accent)}
.chain-node{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;cursor:pointer;transition:all .2s}
.chain-node:hover{border-color:var(--accent);transform:translateY(-1px)}
.chain-node.expanded{border-color:var(--blue);background:rgba(66,165,245,.06)}
.chain-node-name{font-size:12px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tag{font-size:8px;padding:1px 5px;border-radius:2px;font-weight:500}
.tag-upstream{background:rgba(66,165,245,.15);color:var(--blue)}
.tag-midstream{background:rgba(171,71,188,.15);color:#ab47bc}
.tag-end{background:rgba(76,175,80,.15);color:var(--green)}
.chain-node-companies{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.company-tag{font-size:9px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;border:1px solid transparent}
.company-tag:hover{background:rgba(255,193,7,.12);color:var(--accent);border-color:var(--accent)}
.rank-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle}
.rank-dot.r1{background:var(--accent)}.rank-dot.r2{background:rgba(255,193,7,.6)}.rank-dot.r3{background:rgba(255,193,7,.35)}.rank-dot.r4,.rank-dot.r5{background:var(--dim)}
.expand-hint{font-size:9px;color:var(--dim);margin-top:4px}
.sub-nodes{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px}
.sub-node{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:4px;padding:8px 10px}
.sub-node-name{font-size:11px;font-weight:600}
.sub-node-companies{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.chart-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:20px;z-index:1000;width:700px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.chart-popup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999}
.popup-close{position:absolute;top:8px;right:12px;font-size:18px;cursor:pointer;color:var(--dim);background:none;border:none}
.popup-close:hover{color:var(--text)}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:12px;color:var(--muted);margin-bottom:16px}
.back-btn:hover{border-color:var(--accent);color:var(--text)}
.company-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.company-header-name{font-size:22px;font-weight:700}
.company-header-code{font-size:12px;color:var(--dim)}

.company-tab:hover{color:var(--text)}
.company-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.section-sub{font-size:11px;color:var(--dim);margin-bottom:16px}

.fin-table{width:100%;border-collapse:collapse;margin-bottom:24px}
.fin-table th{text-align:right;padding:6px 10px;font-size:10px;color:var(--dim);border-bottom:1px solid var(--border)}
.fin-table th:first-child{text-align:left}
.fin-table td{text-align:right;padding:8px 10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03)}
.fin-table td:first-child{text-align:left;color:var(--muted);font-weight:600}
.fin-table tr:hover td{background:rgba(255,255,255,.03)}

.capacity-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px}
.capacity-card-name{font-size:12px;font-weight:600;margin-bottom:4px}

.capacity-card-rank{font-size:10px;color:var(--accent);margin-top:2px}

.footer{position:fixed;bottom:0;left:0;right:0;padding:3px 20px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:16px;font-size:10px;color:var(--dim)}
.footer span::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:4px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

function updatePEValuation(){
  var slider=document.getElementById('peSlider');
  var peDisplay=document.getElementById('peValue');
  var body=document.getElementById('valuationBody');
  if(!slider||!window._fcData)return;
  
  var pe=parseInt(slider.value);
  peDisplay.textContent=pe+'x';
  
  var fc=window._fcData;
  var scenarios=[
    {key:'pessimistic',label:'悲观',color:'var(--green)'},
    {key:'neutral',label:'中性',color:'var(--accent)'},
    {key:'optimistic',label:'乐观',color:'var(--red)'}
  ];
  
  var rows='';
  scenarios.forEach(function(s){
    var f=fc.forecast[s.key];
    var predictedMktCap=(f.profit*pe).toFixed(0);
    var upside=((predictedMktCap-fc.mktCap)/fc.mktCap*100).toFixed(1);
    var upClass=upside>=0?'up':'down';
    rows+='<tr>';
    rows+='<td style="font-weight:600;color:'+s.color+'">'+s.label+'</td>';
    rows+='<td>'+f.profit+'</td>';
    rows+='<td>'+pe+'x</td>';
    rows+='<td style="font-weight:700;color:var(--accent)">'+Number(predictedMktCap).toLocaleString()+'亿</td>';
    rows+='<td>'+fc.mktCap+'亿</td>';
    rows+='<td class="'+upClass+'" style="font-weight:700;font-size:14px">'+(upside>=0?'+':'')+upside+'%</td>';
    rows+='</tr>';
  });
  body.innerHTML=rows;
}

function renderValuationTab(c){
  var pePb=PE_PB_DATA[c.name];
  if(!pePb)return '<div style="color:#666;padding:40px;text-align:center">暂无估值数据</div>';
  var peVal=pePb.pe.values[pePb.pe.values.length-1];
  var pbVal=pePb.pb.values[pePb.pb.values.length-1];
  var pePctColor=pePb.pePct<=20?'var(--green)':pePb.pePct<=50?'var(--accent)':'var(--red)';
  var pbPctColor=pePb.pbPct<=20?'var(--green)':pePb.pbPct<=50?'var(--accent)':'var(--red)';
  var html='<div class="section-title">估值概览</div><div class="section-sub">PE/PB 3年季度数据 · 当前分位数</div>';
  html+='<div class="valuation-grid">';
  html+='<div class="val-card"><div class="val-label">PE(TTM)</div><div class="val-num" style="color:'+pePctColor+'">'+(peVal||'—')+'</div><div class="val-pct" style="color:'+pePctColor+'">分位数 '+pePb.pePct+'%</div><div class="val-range">3年区间: '+pePb.peRange+'</div></div>';
  html+='<div class="val-card"><div class="val-label">PB(MRQ)</div><div class="val-num" style="color:'+pbPctColor+'">'+(pbVal||'—')+'</div><div class="val-pct" style="color:'+pbPctColor+'">分位数 '+pePb.pbPct+'%</div><div class="val-range">3年区间: '+pePb.pbRange+'</div></div>';
  html+='</div>';
  html+='<div style="display:flex;gap:16px">';
  html+='<div style="flex:1"><div id="peChartEl" style="width:100%;height:260px"></div></div>';
  html+='<div style="flex:1"><div id="pbChartEl" style="width:100%;height:260px"></div></div>';
  html+='</div>';
  // 分位数条
  html+='<div style="margin-top:16px">';
  html+=renderPctBar('PE分位数',pePb.pePct,pePctColor);
  html+=renderPctBar('PB分位数',pePb.pbPct,pbPctColor);
  html+='</div>';
  return html;
}

}

function renderProductsTab(c){
  var html='';
  if(c.topProductsByRev&&c.topProductsByRev.length){
    html+='<div class="section-title">按收入排名前五产品（2025年报）</div><div class="section-sub">营收占比 · 毛利率 · 利润占比</div>';
    html+='<table class="product-table"><thead><tr><th>产品</th><th>营收(亿)</th><th>营收占比</th><th>毛利率</th><th>利润(亿)</th><th>利润占比</th></tr></thead><tbody>';
    c.topProductsByRev.forEach(function(p){
      var revBarW=Math.round(p.revPct*2);
      html+='<tr><td>'+p.name+'</td><td>'+p.rev.toFixed(2)+'</td><td><span class="pct-bar rev" style="width:'+Math.min(revBarW,200)+'px"></span>'+p.revPct.toFixed(1)+'%</td><td>'+p.gm.toFixed(1)+'%</td><td>'+p.profit.toFixed(2)+'</td><td>'+p.profitPct.toFixed(1)+'%</td></tr>';
    });
    html+='</tbody></table>';
  }
  if(c.topProductsByProfit&&c.topProductsByProfit.length){
    html+='<div class="section-title">按利润排名前五产品（2025年报）</div><div class="section-sub">利润占比 · 毛利率 · 营收</div>';
    html+='<table class="product-table"><thead><tr><th>产品</th><th>利润(亿)</th><th>利润占比</th><th>毛利率</th><th>营收(亿)</th></tr></thead><tbody>';
    c.topProductsByProfit.forEach(function(p){
      var profBarW=Math.round(p.profitPct*2);
      html+='<tr><td>'+p.name+'</td><td>'+p.profit.toFixed(2)+'</td><td><span class="pct-bar profit" style="width:'+Math.min(profBarW,200)+'px"></span>'+p.profitPct.toFixed(1)+'%</td><td>'+p.gm.toFixed(1)+'%</td><td>'+p.rev.toFixed(2)+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  if(!html)html='<div style="color:#666;padding:40px;text-align:center">暂无分产品数据</div>';
  return html;
}

function renderQuarterlyChart(elId,q){var el=document.getElementById(elId);if(!el)return;var echarts=getEcharts();if(!echarts)return;var chart=echarts.init(el,'dark');var series=['Q1','Q2','Q3','Q4'].map(function(qi,i){return{name:qi,type:'bar',data:q['q'+(i+1)],barWidth:15}});chart.setOption({backgroundColor:'transparent',grid:{left:50,right:20,top:40,bottom:30},legend:{data:['Q1','Q2','Q3','Q4'],textStyle:{color:'#666',fontSize:10},top:0},xAxis:{type:'category',data:q.years.map(String),axisLabel:{fontSize:10,color:'#666'},axisLine:{lineStyle:{color:'#333'}}},yAxis:{type:'value',axisLabel:{fontSize:9,color:'#666'},splitLine:{lineStyle:{color:'#2a2a2a'}}},series:series,tooltip:{trigger:'axis',backgroundColor:'#2a2a2a',borderColor:'#3a3a3a',textStyle:{color:'#e0e0e0',fontSize:11}}})
}
function renderMiniPriceChart(elId,key,pd){var el=document.getElementById(elId);if(!el)return;var echarts=getEcharts();if(!echarts)return;var chart=echarts.init(el,'dark');var months=[];for(var y=2023;y<=2025;y++)for(var m=1;m<=12;m++)months.push(y+'-'+String(m).padStart(2,'0'));chart.setOption({backgroundColor:'transparent',grid:{left:60,right:20,top:10,bottom:25},xAxis:{type:'category',data:months,axisLabel:{fontSize:8,color:'#666',interval:5},axisLine:{lineStyle:{color:'#333'}},axisTick:{show:false}},yAxis:{type:'value',axisLabel:{fontSize:8,color:'#666'},splitLine:{lineStyle:{color:'#2a2a2a'}},axisLine:{show:false}},series:[{type:'line',data:pd.data,smooth:true,lineStyle:{color:'#ffc107',width:1.5},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(255,193,7,.15)'},{offset:1,color:'rgba(255,193,7,.01)'}]}},symbol:'none'}],tooltip:{trigger:'axis',backgroundColor:'#2a2a2a',borderColor:'#3a3a3a',textStyle:{color:'#e0e0e0',fontSize:10}}})
}
function toggleNode(key,hasSub){if(hasSub){if(expandedNodes.has(key))expandedNodes.delete(key);else expandedNodes.add(key);renderDetail()}}
function selectNode(key){renderChainList()}
function setCat(cat){currentCat=cat;expandedNodes.clear();view='chain';companyPage=null;renderCatFilters();renderChainList();renderCompanyPool();renderDetail()}

document.getElementById('globalSearch').addEventListener('input',function(e){var q=e.target.value.toLowerCase();if(!q){setCat(currentCat);return}var filtered=DATA.filter(function(d){return(d.cat+d.p1+d.p2+d.end+d.app+d.aname+d.hname).toLowerCase().indexOf(q)>=0});var groups={};filtered.forEach(function(d){var k=d.p1+(d.p2?' > '+d.p2:'');if(!groups[k])groups[k]=[];groups[k].push(d)});document.getElementById('chainList').innerHTML=Object.keys(groups).map(function(k){var items=groups[k];return '<div class="chain-item" onclick="selectNode(\''+items[0].p1+'|'+(items[0].p2||'')+'\')"><span class="chain-item-name">'+k+'</span><span class="chain-item-count">'+new Set(items.map(function(i){return i.aname||i.hname})).size+'家</span></div>'}).join('')||'<div style="padding:16px;color:#666">无匹配</div>'});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePopup()});
